<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central Graphic: Clipboard + Check + Timer -->
  <g filter="url(#dropShadow)">
    <!-- Clipboard Board -->
    <rect x="120" y="110" width="272" height="320" rx="36" fill="#ffffff" />
    
    <!-- Clipboard Clip -->
    <rect x="180" y="80" width="152" height="56" rx="20" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="4" />
    <circle cx="256" cy="108" r="12" fill="#4f46e5" />

    <!-- Lines / Tasks on Board -->
    <!-- Line 1 with Checkmark -->
    <circle cx="168" cy="190" r="16" fill="#10b981" />
    <path d="M161 190 L166 195 L175 184" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="200" y="182" width="152" height="16" rx="8" fill="#e2e8f0" />

    <!-- Line 2 with In-Progress Timer -->
    <circle cx="168" cy="254" r="16" fill="#6366f1" />
    <path d="M168 244 L168 254 L175 258" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <rect x="200" y="246" width="120" height="16" rx="8" fill="#e2e8f0" />

    <!-- Line 3 -->
    <circle cx="168" cy="318" r="16" fill="#cbd5e1" />
    <rect x="200" y="310" width="140" height="16" rx="8" fill="#e2e8f0" />

    <!-- Circular Stopwatch Badge on Bottom-Right -->
    <g transform="translate(300, 300)">
      <circle cx="64" cy="64" r="68" fill="#0f172a" />
      <circle cx="64" cy="64" r="60" fill="#4f46e5" />
      <!-- Timer Ring -->
      <circle cx="64" cy="64" r="48" fill="none" stroke="#818cf8" stroke-width="6" stroke-dasharray="210" stroke-dashoffset="60" stroke-linecap="round" />
      <!-- Stopwatch Top Button -->
      <rect x="58" y="2" width="12" height="10" rx="3" fill="#ffffff" />
      <!-- Clock Hands -->
      <line x1="64" y1="64" x2="64" y2="40" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <line x1="64" y1="64" x2="84" y2="64" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <circle cx="64" cy="64" r="6" fill="#ffffff" />
    </g>
  </g>
</svg>
